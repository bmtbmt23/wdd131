<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This project is about product review form, installation date, written feedback and more of products">
    <meta name="author" content="Bruna Beck">
    <link rel="stylesheet" href="styles/form.css">
    <script src="js/product.js" defer></script>
    <script src="js/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="title">Product Review</h1>
    </header>
        <main>
     
          <form action="review.html" method="get">
           
            <div class="product-form">
              <label for="product">
                Product Name <span class="required">*</span>
              </label>
              <select id="product" name="product" required>
                  <option value="" selected disabled>
                    Select a Product...
                  </option>
                  <option value="PT-1988">AI Productivity Tools</option>
                  <option value="PT-1987">Mini Desktop Robots</option>
                  <option value="PT-1980">Mobile Gaming</option>
                  <option value="PT-1983">Smart Health</option>
                  <option value="PT-2018">Wearables</option>
                  <option value="PT-2008">Computer</option>
                  </select>
                </div>
              
               <fieldset>
                  <legend>Overall Rating <span class="required">*</span></legend>
                  <input type="radio" id="pro1" name="rating" value="1" required><label for="pro1">⭐</label>
                           <input type="radio" id="pro2" name="rating" value="2" required><label for="pro2">⭐⭐</label>
                          <input type="radio" id="pro3" name="rating" value="3" required><label for="pro3">⭐⭐⭐</label>
                           <input type="radio" id="pro4" name="rating" value="4" required><label for="pro4">⭐⭐⭐⭐</label>
                           <input type="radio" id="pro5" name="rating" value="5" required><label for="pro5">⭐⭐⭐⭐⭐</label>
              </fieldset>
                 
              <fieldset>
                <label for="installD">Date of Installation<span class="required">*</span></label>
                <input type="date" id="installD" name="installD" required>
              </fieldset>
               
                <fieldset>
                  <label> Useful Features</label>
                  <input type="checkbox" id="durability" name="features" value="durability">
                  <label for="durabiliry">Durability</label>
                  <input type="checkbox" id="easy" name="features" value="easy">
                  <label for="easy">Easy of Use</label>
                  <input type="checkbox" id="performance" name="features" value="performance">
                  <label for="performance">Performance</label>
                  <input type="checkbox" id="design" name="features" value="design">
                  <label for="design">Design</label>
                  </fieldset>
        <fieldset>
          <div class="form-review">
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="6"></textarea>
            </div>
        </fieldset>
         
          <fieldset>
            <div class="form-username">
              <label for="username"> User Name</label>
              <input type="text" id="username" name="username"></div>
          </fieldset>
            <input type="submit" value="Post Review">
          </form>
        </main>
        <footer>
          <p id="currentYear"></p>
          <p id="lastModified"></p>
        </footer>
      </body>
    </html>
